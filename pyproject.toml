[project]
name = "luke"
version = "1.0.0"
description = "A personal assistant that remembers everything, automates anything, and gets smarter over time"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "aiogram>=3.30",
    "pydantic-settings>=2.14",
    "structlog>=26.1",
    "croniter>=6.2",
    "pyyaml>=6.0.3",
    "Pillow>=12.3",
    "sqlite-vec>=0.1.9",
    # fastembed is imported only by scripts/bge_embed_server.py (the single
    # canonical copy of the embedding model); luke itself embeds via HTTP.
    "fastembed>=0.8",
    "mlx-whisper>=0.4.3",
    "playwright>=1.62",
    "scikit-learn>=1.9",
]

[project.scripts]
luke = "luke.app:cli"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luke"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlite_vec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mlx_whisper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::ResourceWarning"]

[tool.uv]
default-groups = ["dev", "test"]
# numba (via mlx-whisper) lags numpy: without this floor the resolver "solves"
# a numpy upgrade by downgrading numba to a 2021 release that cannot build on
# Python 3.14. Hold numba modern; numpy settles at the newest compatible.
constraint-dependencies = ["numba>=0.65.1"]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
    "types-croniter>=6.2.4.20260711",
    "types-pyyaml>=6.0.12.20260724",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
]
